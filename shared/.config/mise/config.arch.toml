[bootstrap.packages]
"pacman:base-devel" = "latest"
"pacman:fish" = "latest"
"pacman:fuse-overlayfs" = "latest"
"pacman:git" = "latest"
"pacman:git-lfs" = "latest"
"pacman:github-cli" = "latest"
"pacman:less" = "latest"
"pacman:mosh" = "latest"
"pacman:xsel" = "latest"
# AUR packages: add "aur:<pkg>" = "latest" entries here. The post-packages hook
# installs yay, so ./bootstrap installs them in its second mise pass.

[bootstrap.hooks.post-packages]
run = ['bash "$HOME/code/laulauland/dotfiles/shared/.config/mise/hooks/arch-post-packages"']

[bootstrap.user]
login_shell = "/usr/bin/fish"

[dotfiles]
"~/.gitconfig-os" = "~/code/laulauland/dotfiles/arch/.gitconfig-os"
"~/.config/pnpm/config.yaml" = "~/code/laulauland/dotfiles/shared/.config/pnpm/config.yaml"
