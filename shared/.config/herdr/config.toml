onboarding = false
# herdr configuration
# Matches the ghostty/tmux setup: colors follow the active terminal theme, and
# keybindings mirror the tmux prefix workflow.

[theme]
# Herdr chrome follows Ghostty's light/dark appearance via auto_switch, using
# the one-light/one-dark built-in sibling pair (upstream #1307 makes the raw
# `terminal` theme unreliable on Ghostty light). Pane content still follows
# Ghostty's live ANSI colors; only chrome uses these palettes.
name = "one-dark"
auto_switch = true
light_name = "one-light"
dark_name = "one-dark"

[theme.custom]
# Blend panels into the real terminal background so chrome sits on
# Alabaster/Ghostty Dark instead of a themed slab. Accent stays as our
# high-contrast anchor for borders/highlights.
panel_bg = "reset"
sidebar_bg = "reset"
accent = "#005fcc"

[keys]
# Prefix matches tmux's C-Space (replaces herdr's default ctrl+b).
prefix = "ctrl+space"

# Tmux-oriented bindings. Herdr supports one binding per action, so where tmux
# has aliases this picks the binding from tmux.conf that best matches intent.
help = "prefix+?"
detach = "prefix+d"              # tmux default prefix d
reload_config = "prefix+r"       # tmux `bind r source-file`
workspace_picker = "prefix+w"    # tmux session picker
new_workspace = "prefix+shift+s" # tmux `bind S` new session equivalent
new_worktree = ""                # use the Pando plugin instead of Herdr's git worktrees
open_worktree = ""
remove_worktree = ""
new_tab = "prefix+c"             # tmux `bind c`
previous_tab = "prefix+p"        # tmux default previous-window
next_tab = "prefix+n"            # tmux default next-window
switch_tab = "prefix+1..9"       # tmux window indexes
close_pane = "prefix+x"          # tmux `bind x`
close_tab = "prefix+shift+x"     # tmux `bind X`
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
split_vertical = "prefix+|"      # tmux `bind |` side-by-side split
split_horizontal = "prefix+minus" # tmux `bind -` stacked split
zoom = "prefix+enter"            # tmux `bind Enter resize-pane -Z`
edit_scrollback = "prefix+y"     # tmux copy-mode binding
resize_mode = "prefix+shift+r"   # keep prefix+r reserved for reload

[[keys.command]]
key = "prefix+shift+g"
type = "plugin_action"
command = "laulauland.pando-workspace.new"
description = "new pando workspace"

[[keys.command]]
key = "prefix+alt+g"
type = "plugin_action"
command = "laulauland.pando-workspace.new-tab"
description = "new pando workspace (in tab)"

[[keys.command]]
key = "prefix+alt+d"
type = "plugin_action"
command = "laulauland.pando-workspace.remove"
description = "remove pando workspace"

# herdr-annotate (lite) — terminal annotations. Over SSH, `prefix+a` is
# unreliable (herdrdev/herdr#3380): trigger via
# `ssh <host> herdr plugin action invoke annotate.capture` or the nvim
# <leader>ha mapping instead.
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"
description = "annotate text"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "annotate.copy-context"
description = "copy annotations as context"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "annotate.manage"
description = "manage annotations"

[ui]
# Keep selections alive after mouse-up so the herdr-annotate plugin can read
# them over SSH (prefix+a clears the selection before the action runs; the
# remote flow is `ssh <host> herdr plugin action invoke annotate.capture`).
# Copy explicitly with Ctrl+C instead.
copy_on_select = false

# Let [theme.custom].accent drive borders, highlights, and navigation UI.
agent_panel_sort = "priority"

show_agent_labels_on_pane_borders = true
[ui.toast]
delivery = "herdr"

[experimental]
pane_history = true

# Pi renders its own reverse-video cursor. Keep the attached terminal's native
# cursor visible over that cell so SSH/mosh clients use their local cursor color.
# reveal_hidden_cursor_for_cjk_ime = true
# cjk_ime_agents = ["pi"]
